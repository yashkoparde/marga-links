<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.A.R.G.A - Project Links & Demonstration Portal</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #060913;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --portal-accent: #38bdf8;
      --portal-gradient: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      --portal-glow: rgba(56, 189, 248, 0.35);
      
      --ai-accent: #c084fc;
      --ai-gradient: linear-gradient(135deg, #c084fc 0%, #9333ea 100%);
      --ai-glow: rgba(192, 132, 252, 0.35);
      
      --yt-accent: #f87171;
      --yt-gradient: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
      --yt-glow: rgba(248, 113, 113, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Professional Mesh Background with Animated Subtle Glows */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: 
        radial-gradient(at 10% 20%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 90% 15%, rgba(192, 132, 252, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 85%, rgba(248, 113, 113, 0.1) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(15, 23, 42, 0.8) 0px, transparent 50%);
      pointer-events: none;
    }

    /* Grid overlay pattern */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 4rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
    }

    header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      line-height: 1.1;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.15rem;
      max-width: 680px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="bg-canvas"></div>
  <div class="bg-grid"></div>

  <div class="container">
    <header>
      <div class="badge">
        <span class="badge-dot"></span>
        Evaluation & Deployment Hub
      </div>
      <h1>M.A.R.G.A Project Portal</h1>
      <p>Multi-Role Civic Infrastructure Operating System for MPLADS Project Verification, Intelligence & Auditing</p>
    </header>

    <div class="grid">
    </div>
  </div>

</body>
</html>
