<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.A.R.G.A - Project Links & Demonstration Portal</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #060913;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --portal-accent: #38bdf8;
      --portal-gradient: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      --portal-glow: rgba(56, 189, 248, 0.35);
      
      --ai-accent: #c084fc;
      --ai-gradient: linear-gradient(135deg, #c084fc 0%, #9333ea 100%);
      --ai-glow: rgba(192, 132, 252, 0.35);
      
      --yt-accent: #f87171;
      --yt-gradient: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
      --yt-glow: rgba(248, 113, 113, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem 1.5rem;
      position: relative;
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  <h1>M.A.R.G.A Portal</h1>
</body>
</html>
